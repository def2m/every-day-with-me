name: Android APK Oluştur ve Yayınla (Build APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: APK Derle (Release APK)
    runs-on: ubuntu-latest

    steps:
      - name: Kodu İndir (Checkout)
        uses: actions/checkout@v4

      - name: Java Kurulumu (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Android Platform Dosyalarını Kontrol Et
        run: flutter create --platforms=android --org com.gun365 .

      - name: Paketleri İndir (pub get)
        run: flutter pub get

      - name: İmza Anahtarını Hazırla (Keystore)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "::error::GitHub Secrets eksik! ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD ve ANDROID_KEY_ALIAS tanımlanmalı. Aksi halde APK her seferinde farklı anahtarla imzalanır ve güncelleme kurulamaz."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > android/app/release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.jks\n' "$KS_PASS" "$KS_PASS" "$KS_ALIAS" > android/key.properties

      - name: Sürüm Numarasını Belirle
        id: version
        run: |
          BASE=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | sed 's/+.*//' | cut -d. -f1,2)
          VERSION="$BASE.${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Sürüm: $VERSION"

      - name: APK'yı Derle (Release APK)
        run: flutter build apk --release --build-name=${{ steps.version.outputs.version }} --build-number=${{ github.run_number }}

      - name: APK Dosyasını Yeniden Adlandır
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/gun365-release.apk

      - name: APK'yı GitHub Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: gun365-apk
          path: output/gun365-release.apk
          retention-days: 30

      - name: GitHub Release Olarak Yayınla (Otomatik Sürüm)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 365 Gün Uygulaması v${{ steps.version.outputs.version }}
          make_latest: true
          draft: false
          prerelease: false
          files: output/gun365-release.apk
          body: |
            ✨ **365 Gün (Gökyüzü Günlüğü) Android APK** ✨
            
            Sürüm: **v${{ steps.version.outputs.version }}**
            
            ### 🔄 Otomatik Güncelleme
            Uygulamanız artık otomatik güncelleme destekli!
            Her açılışta yeni sürüm kontrolü yapar ve varsa size bildirir.
            
            ### 📱 Kurulum Adımları:
            1. Aşağıdaki **Assets** bölümünden **`gun365-release.apk`** dosyasına telefonunuzdan tıklayıp indirin.
            2. İndirilen dosyaya dokunun ve **Yükle** seçeneğini seçin.
            3. Eğer "Bilinmeyen kaynaklardan yükleme" uyarısı çıkarsa "İzin ver" veya "Yine de yükle" deyin.
            4. Uygulamanız hazır! Her gün girip anılarınızı birer yıldıza dönüştürebilirsiniz. ⭐🌙
