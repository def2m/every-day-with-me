<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Every Day With Me</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#14302B">
<style>
:root{--bg:#EEF3F1;--ink:#14302B;--mute:#5B7570;--line:#C9D6D2;--sun:#E0A526;--card:#fff;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10201D;--ink:#E7F0ED;--mute:#8FA8A2;--line:#2A423D;--card:#17302B}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:34rem;margin:0 auto;padding:1.5rem 1.25rem 3rem}
.date{font:700 2.2rem/1.1 "Iowan Old Style",Georgia,serif;margin:.5rem 0 .25rem}
.streak{color:var(--mute);margin:0 0 1.25rem}
.streak b{color:var(--ink);background:var(--sun);padding:0 .45em;border-radius:.4em}
textarea{width:100%;min-height:8rem;resize:vertical;padding:1rem;border:2px solid var(--line);border-radius:.75rem;
 background:var(--card);color:var(--ink);font:inherit}
textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-color:transparent}
.status{color:var(--mute);font-size:.9rem;margin:.4rem 0 1.75rem;min-height:1.3em}
h2{font:700 1.1rem/1.2 "Iowan Old Style",Georgia,serif;margin:0 0 .5rem}
.entry{padding:.75rem 0;border-top:1px solid var(--line)}
.entry time{display:block;color:var(--mute);font-size:.85rem}
.entry p{margin:.15rem 0 0;white-space:pre-wrap}
.empty{color:var(--mute)}
footer{margin-top:2rem;color:var(--mute);font-size:.8rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1 class="date" id="today"></h1>
  <p class="streak" id="streak"></p>
  <label for="note" class="empty">Bugün seninle ne oldu?</label>
  <textarea id="note" placeholder="Bir iki cümle yeter."></textarea>
  <div class="status" id="status"></div>
  <h2>Önceki günler</h2>
  <div id="list"></div>
  <footer id="ver">Uygulama kendini otomatik günceller.</footer>
</main>
<script>
const P='edwm:';
const key=d=>P+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const get=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};
const set=(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k);return true}catch(e){return false}};
const $=id=>document.getElementById(id);
const now=new Date(), tk=key(now);

$('today').textContent=now.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'});
$('note').value=get(tk);

function streak(){
  let n=0,d=new Date(now);
  if(!get(key(d)).trim())d.setDate(d.getDate()-1);
  while(get(key(d)).trim()){n++;d.setDate(d.getDate()-1)}
  return n;
}
function render(){
  const s=streak();
  $('streak').innerHTML=s?'<b>'+s+'</b> gün üst üste':'Bugün yaz, seri başlasın.';
  const items=[];
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(P)&&k!==tk&&get(k).trim())items.push(k)}}catch(e){}
  items.sort().reverse();
  $('list').innerHTML=items.length?'':'<p class="empty">Henüz önceki gün yok.</p>';
  items.forEach(k=>{
    const e=document.createElement('div');e.className='entry';
    const t=document.createElement('time');
    t.textContent=new Date(k.slice(P.length)+'T12:00:00').toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    const p=document.createElement('p');p.textContent=get(k);
    e.append(t,p);$('list').append(e);
  });
}
let timer;
$('note').addEventListener('input',e=>{
  clearTimeout(timer);$('status').textContent='';
  timer=setTimeout(()=>{
    const ok=set(tk,e.target.value.trim());
    $('status').textContent=ok?'Kaydedildi':'Kaydedilemedi: tarayıcı depolamaya izin vermiyor.';
    render();
  },500);
});
render();

/* ---- Otomatik güncelleme: GitHub'a yeni dosya gelince açık uygulama kendini yeniler ---- */
async function sig(){
  const r=await fetch('index.html',{cache:'no-store'});
  const t=await r.text();let h=0;
  for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;
  return h;
}
let first=null;
async function check(){
  try{
    const h=await sig();
    if(first===null){first=h;return}
    if(h!==first)location.reload();
  }catch(e){}   // çevrimdışıysa sessizce geç
}
check();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});
setInterval(check,10*60*1000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});
</script>
</body>
</html>
